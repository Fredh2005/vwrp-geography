name: Rebuild nightly from live data

# The screener republishes data.json every night from 21:35 UK with live market
# caps and fundamentals for every holding it prices. This picks that up and
# recomputes the live weight, valuation, growth and return layers.
#
# Vanguard's published weights come from the .xlsx in holdings/ and only change
# when a new export is committed — those are the authoritative figures and are
# deliberately not derived from live prices.
#
# GitHub's scheduler is best-effort: on 26-27 Aug 2026 it dropped roughly 44
# hours of firings across every repo here, silently, and this page went two
# days without a rebuild. So the schedule no longer depends on any single
# firing - several crons fire through the night and each run rebuilds only if
# this cycle has not already been done. The guard reads the wall clock to ask
# "has tonight's cycle published yet?", which a delayed run answers correctly,
# rather than the old "which cron slot am I in?", which it answers wrongly.
on:
  schedule:
    - cron: "20 22 * * *"    # 23:20 UK in BST - the on-time slot
    - cron: "30 23 * * *"    # 23:30 UK in GMT - the on-time slot
    - cron: "40 0 * * *"     # catch-up
    - cron: "50 2 * * *"     # catch-up
    - cron: "0 5 * * *"      # catch-up
  push:
    paths:
      - "holdings/**"
      - "build.py"
      - "template.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          SITE: https://fredh2005.github.io/vwrp-geography/
          FEED: https://fredh2005.github.io/vwrp-screener1/data.json
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual or push-triggered run - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(date +%s)
          UK_H=$(TZ=Europe/London date +%-H)

          # The cycle starts at 23:20 UK and runs past midnight, so before
          # 10:00 UK we are still working on last night's cycle.
          if [ "$UK_H" -lt 10 ]; then
            CYCLE=$(TZ=Europe/London date -d 'yesterday' +%F)
          else
            CYCLE=$(TZ=Europe/London date +%F)
          fi
          echo "UK now: $(TZ=Europe/London date '+%F %H:%M %Z')  cycle=$CYCLE"

          # Never rebuild early: in GMT the first slot lands at 22:20 UK.
          TARGET=$(TZ=Europe/London date -d "$CYCLE 23:20" +%s)
          if [ "$NOW" -lt "$TARGET" ]; then
            echo "Before 23:20 UK - too early. A later slot will pick this up."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WINDOW=$(TZ=Europe/London date -d "$CYCLE 23:00" +%s)
          # The screener's own cycle opens at 21:00 UK on the same date.
          FEED_WINDOW=$(TZ=Europe/London date -d "$CYCLE 21:00" +%s)

          head_epoch() {
            local lm
            lm=$(curl -sSI --max-time 30 "$1" | tr -d '\r' \
                 | awk -F': ' 'tolower($1)=="last-modified"{print $2}') || lm=""
            if [ -z "$lm" ]; then echo ""; else date -d "$lm" +%s 2>/dev/null || echo ""; fi
          }

          PUB=$(head_epoch "$SITE")
          if [ -n "$PUB" ] && [ "$PUB" -ge "$WINDOW" ]; then
            echo "Already rebuilt for the $CYCLE cycle - nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rebuilding from a stale feed would publish yesterday's numbers as
          # tonight's. If the screener has not refreshed yet, wait for a later
          # catch-up slot instead - which is also how a delayed screener run
          # still gets picked up the same night.
          FEED_PUB=$(head_epoch "$FEED")
          if [ -z "$FEED_PUB" ]; then
            echo "Could not read the feed's Last-Modified - proceeding anyway."
          elif [ "$FEED_PUB" -lt "$FEED_WINDOW" ]; then
            echo "Screener feed has not refreshed for the $CYCLE cycle yet - waiting."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Feed is current and tonight's rebuild has not run - proceeding."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pandas openpyxl

      - name: Fetch world topology
        run: |
          curl -fsSLo /tmp/world50m.json \
            https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json
          test -s /tmp/world50m.json

      - name: Rebuild
        env:
          FEED_URL: https://fredh2005.github.io/vwrp-screener1/data.json
        run: python build.py

      - name: Fail if the rebuild looks wrong
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("mapdata.json"))
          n, w = len(d["countries"]), d["mappedWeight"]
          live = d.get("live", {})
          print(f"countries {n} | weight {w}% | live countries {live.get('countries', 0)}")
          # Republishing a thin page over a good one is worse than a red X.
          if n < 30:
              sys.exit(f"::error::Only {n} countries mapped.")
          if w < 90:
              sys.exit(f"::error::Only {w}% of fund weight mapped.")
          PY

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mapdata.json manifest.webmanifest \
                  apple-touch-icon.png icon-192.png icon-512.png
          if git diff --staged --quiet; then
            echo "Nothing changed since last night."
          else
            git commit -m "chore: nightly rebuild from live screener data"
            git push
          fi
